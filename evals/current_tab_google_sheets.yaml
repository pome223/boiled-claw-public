id: current_tab_google_sheets_phase0
goal: "Use the current browser session to write structured research notes into Google Sheets without losing context."
slice_type: long_running_vertical_slice
substrate:
  - task_store
  - trajectory_store
  - task_graph
  - checkpoint_resume
  - durable_verifier_verdicts
  - scheduler_queue_state
  - recovery_policy
  - guardrail_budget
  - human_escalation_queue
  - replay_report
  - approval_gated_promotion
expected_artifacts:
  - trajectory_id
  - verifier_result
  - verifier_verdict
  - failure_type
  - recommended_repair_targets
  - candidate_promotion_artifacts
  - replay_reference
  - recovery_policy
  - recovery_decision
  - budget_state
  - scheduler_queue_entry
  - escalation_record
  - task_graph
  - checkpoint
  - job_run
  - scheduler_state
  - reuse_suggestions
surfaces:
  - current_tab
  - desktop
  - browser
success_criteria:
  - destination_url_contains: "docs.google.com/spreadsheets"
  - sheet_contains_any:
      - "Source"
      - "Summary"
  - evidence_required: "destination_bound_text_or_screenshot"
  - write_target: "sheet_cell"
runs: 5
budget:
  max_runtime_hours: 72
  max_total_llm_calls: 1200
  max_total_tool_calls: 5000
  max_same_failure_retries: 3
  max_repair_depth: 2
  max_pending_approvals: 5
failure_buckets:
  - weak_evidence
  - focus_mismatch
  - wrong_surface
  - target_context_mismatch
match:
  action: fill
  final_surface_any:
    - current_tab
    - desktop
    - browser
  status_any:
    - success
    - recovered
    - failed
  request:
    verify:
      url_contains: "docs.google.com/spreadsheets"
