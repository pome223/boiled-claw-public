services:
  app:
    build:
      context: .
      args:
        INSTALL_BROWSER: "false"
    container_name: boiled-claw
    env_file:
      - .env
    ports:
      - "18789:18789"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=18789
      - FILE_WORKSPACE_PATHS=/app/data,/app/skills
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped
